name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Project Structure Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Godot project structure
        run: |
          ls project.godot || ls *.godot || echo "Godot project file check"
          ls scenes/ || true
          ls scripts/ || true
          echo "Godot export requires Godot CLI on a self-hosted runner."
          echo "Use abarichello/godot-ci@v3 for automated exports."

  # To enable Godot export:
